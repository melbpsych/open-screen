name: Verify Open Screen
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Official v1.64.1-noble image: browsers + their reviewed OS dependencies.
      image: mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: apt-get update && apt-get install -y python3 poppler-utils
      - run: npm ci
      - name: Match the ephemeral home directory to the container user
        # GitHub mounts this directory with a different UID. Firefox refuses
        # root launch against another user's home. Preserve HOME and sandbox flags.
        run: chown -- "$(id -u):$(id -g)" "$HOME"
      - run: npm run verify
      - run: npm run test:demo
      - name: Retain synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-screen-synthetic-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
